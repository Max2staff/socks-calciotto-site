<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1e25">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'self'">
<title>SOCKS · admin</title>
<link rel="icon" href="icons/logo.jpg" type="image/jpeg">
<link rel="apple-touch-icon" href="icons/logo.jpg">
<link rel="stylesheet" href="css/app.css">
<style>
  form.op { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s-2); }
  form.op select { width: 100%; min-width: 0; }
  form.op label { display: flex; flex-direction: column; gap: .25rem; font-size: .68rem; color: var(--muto); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
  form.op input, form.op select, form.op textarea { padding: .6rem; border: 1px solid var(--bordo); border-radius: var(--r-sm); background: var(--carta); color: var(--testo); font-size: 1rem; font-weight: 400; text-transform: none; letter-spacing: 0; }
  form.op input:focus, form.op select:focus, form.op textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  .esito-op { min-height: 1.4em; font-size: .9rem; font-weight: 600; }
  .ok { color: var(--ok); } .ko { color: var(--ko); }
  .presenze { display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--s-3); }
  .presenze label { flex-direction: row; align-items: center; gap: .5rem; padding: .35rem 0; font-size: .95rem; color: var(--testo); text-transform: none; letter-spacing: 0; font-weight: 400; }
  .presenze input { width: 1.1rem; height: 1.1rem; accent-color: var(--brand); }
  .schede { position: sticky; top: 0; z-index: 2; margin: var(--s-2) 0; }
  .anteprima { min-height: 1.2em; font-size: .9rem; }
  form.op label.in-riga { flex-direction: row; align-items: center; gap: .5rem; }
  button.link { background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--brand); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: left; }
  .bottone.piccolo { padding: .3rem .6rem; font-size: .8rem; }
  details.giocatore { border-bottom: 1px solid var(--bordo); }
  details.giocatore:last-child { border-bottom: 0; }
  details.giocatore summary { display: flex; justify-content: space-between; align-items: center; gap: var(--s-2); padding: .55rem 0; cursor: pointer; list-style: none; }
  details.giocatore summary::-webkit-details-marker { display: none; }
  details.giocatore summary > span:last-child { text-align: right; white-space: nowrap; }
  details.giocatore form { padding-bottom: var(--s-3); }
  #estratto { scroll-margin-top: 5rem; }
  table.estratto td { vertical-align: top; }
  table.estratto td.sx { white-space: normal; }
  table.estratto .bottone.piccolo { margin-top: .35rem; }
  .controllo { padding: .5rem 0; border-bottom: 1px solid var(--bordo); }
  .controllo:last-of-type { border-bottom: 0; }
</style>
</head>
<body>
<div id="app"><p class="caricamento">Caricamento…</p></div>
<script type="module" src="js/admin.js"></script>
</body>
</html>
